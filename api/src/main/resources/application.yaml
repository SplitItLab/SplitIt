
server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: splitit
  config:
    import: >-
      optional:file:.env[.properties],
      optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5433}/${POSTGRES_DB}?timezone=America/Argentina/Buenos_Aires
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update

jwt:
  secret: ${JWT_SECRET}
  expiration-hours: ${JWT_EXPIRATION_HOURS:8}
