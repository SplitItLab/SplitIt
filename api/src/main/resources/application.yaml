
server:
  port: ${PORT:${SERVER_PORT:8080}}
spring:
  application:
    name: splitit
  main:
    lazy-initialization: ${SPRING_LAZY_INIT:false}
  config:
    import: >-
      optional:file:.env[.properties],
      optional:file:../.env[.properties]
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 0
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5433}/${POSTGRES_DB:${POSTGRES_DATABASE:splitit}}?sslmode=${POSTGRES_SSLMODE:disable}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: 0
      initialization-fail-timeout: -1
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate.boot.allow_jdbc_metadata_access: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
  data:
    jpa:
      repositories:
        bootstrap-mode: ${JPA_BOOTSTRAP_MODE:default}

jwt:
  secret: ${JWT_SECRET}
  expiration-hours: ${JWT_EXPIRATION_HOURS:8}

google:
  # Falls back to the web build variable so one value serves local; production sets GOOGLE_CLIENT_ID.
  client-id: ${GOOGLE_CLIENT_ID:${NEXT_PUBLIC_GOOGLE_CLIENT_ID:}}

auth:
  cookie:
    name: ${AUTH_COOKIE_NAME:auth_token}
    secure: ${AUTH_COOKIE_SECURE:true}
    same-site: ${AUTH_COOKIE_SAME_SITE:Lax}

exchange-rate:
  url: ${EXCHANGE_RATE_URL:https://open.er-api.com/v6/latest/USD}
  timeout: ${EXCHANGE_RATE_TIMEOUT:5s}
  cache-ttl: ${EXCHANGE_RATE_CACHE_TTL:30m}

# Interactive API docs: off unless API_DOCS_ENABLED=true. Paths stay under /api/ so Vercel routes them to the API.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
    path: /api/v3/api-docs
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
    path: /api/swagger-ui.html

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,https://*.vercel.app}

kpi:
  export:
    mode: ${KPI_EXPORT_MODE:local}
    env: ${KPI_EXPORT_ENV:dev}
    supabase:
      url: ${SUPABASE_URL:}
      publishable-key: ${SUPABASE_PUBLISHABLE_KEY:}
      project-key: ${SUPABASE_PROJECT_KEY:}
  report:
    cron: ${KPI_REPORT_CRON:0 15 3 * * *}
    zone: ${KPI_REPORT_ZONE:UTC}
