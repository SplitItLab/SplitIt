name: API Pipeline - CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api-pipeline.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "api/**"
      - ".github/workflows/api-pipeline.yml"
  workflow_dispatch:


concurrency:
  group: api-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Back (format · lint · static · test · build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Format check (ktlint)
        run: ./gradlew ktlintCheck

      - name: Lint + Static analysis (detekt)
        run: ./gradlew detekt

      - name: Test
        run: ./gradlew test

      - name: Build
        run: ./gradlew build -x test

  image:
    name: Publish image → GHCR
    needs: api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: api
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  deploy:
    name: Deploy → Azure Container App
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Only the image changes: env vars and secrets of the revision are kept.
      - name: Update container image
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update \
            --name ca-splitit-api \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "ghcr.io/${GITHUB_REPOSITORY,,}/api:sha-${GITHUB_SHA::7}"
